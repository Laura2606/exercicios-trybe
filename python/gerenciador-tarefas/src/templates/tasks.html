<!DOCTYPE html>
<html>

<head>
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <!-- <h1>Gerenciador de Tarefas</h1> -->
    <div class="container">
        <h2>Tarefas:</h2>
        <ul>
            {% for task in tasks %}
            <li {% if task.completed %}class="completed" {% endif %}>
                {{ task.title }}
                {% if not task.completed %}
                <form method="GET" action="/complete/{{ task.id }}">
                    <button type="submit" class="complete">Concluir</button>
                </form>
                {% endif %}
            </li>
            {% endfor %}
        </ul>
    </div>
    <div class="container-form">
        <h2>Adicionar Tarefa:</h2>
        <div class="form-group">
            <form method="POST" action="/">
                <input type="text" name="title" placeholder="Digite o título da tarefa" required>
                <button type="submit" class="add-task">Adicionar</button>
            </form>
        </div>
    </div>
</body>

</html>
