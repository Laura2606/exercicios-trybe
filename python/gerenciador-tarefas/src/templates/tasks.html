<!DOCTYPE html>
<html>

<head>
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&display=swap">
</head>

<body>
    <!-- <h1>Gerenciador de Tarefas</h1> -->
    <div class="container-form">
        <h2>Adicionar Tarefa:</h2>
        <div class="form-group">
            <form method="POST" action="/">
                <input type="text" name="title" placeholder="Digite o título da tarefa" required>
                <button type="submit" class="add-task">Adicionar</button>
            </form>
        </div>
    </div>
    <div class="container">
        <h2>Tarefas:</h2>
        <ul>
            {% for task in tasks %}
            <li {% if task.completed %}class="completed" {% endif %}>
                {{ task.title }}
                <div class="button-container">
                    {% if task.completed %}
                    <form method="POST" action="/undo/{{ task.id }}">
                        <button type="submit" class="undo">Desfazer</button>
                    </form>
                    {% else %}
                    <form method="GET" action="/complete/{{ task.id }}">
                        <button type="submit" class="complete">Concluir</button>
                    </form>
                    {% endif %}
                    <form method="POST" action="/delete/{{ task.id }}">
                        <button type="submit" class="delete">Apagar</button>
                    </form>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>

</body>

</html>
